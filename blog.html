<section class="page-heading"><p class="eyebrow">THE NOTEBOOK</p><h1>Notes along the way.</h1><p class="intro">Ideas, project notes, and things worth writing down.</p></section><section aria-label="Blog posts">{% for post in site.posts %}<a class="post-row" href="{{ post.url | relative_url }}"><time>{{ post.date | date: '%b %-d, %Y' }}</time><div><h2>{{ post.title }}</h2><p>{{ post.description }}</p></div><span>↗</span></a>{% else %}<p>New writing is on its way.</p>{% endfor %}</section>
