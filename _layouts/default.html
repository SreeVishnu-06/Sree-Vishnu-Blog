<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title><meta name="description" content="{{ page.description | default: site.description | escape }}"><link rel="stylesheet" href="{{ '/style.css' | relative_url }}"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232c5747'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia' font-size='34' fill='white'%3ES%3C/text%3E%3C/svg%3E"></head>
<body><a class="skip" href="#main">Skip to content</a><header><a class="brand" href="{{ '/' | relative_url }}">sv<span>.</span></a><nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a><a href="{{ '/projects/' | relative_url }}" {% if page.url == '/projects/' %}aria-current="page"{% endif %}>Projects</a><a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}aria-current="page"{% endif %}>Blog</a><a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a></nav></header>
<main id="main">{% if page.date %}<article class="prose"><a class="eyebrow" href="{{ '/blog/' | relative_url }}">← All writing</a><h1>{{ page.title }}</h1><p class="muted">{{ page.date | date: '%B %-d, %Y' }}</p>{{ content }}</article>{% else %}{{ content }}{% endif %}</main>
<footer><span>© {{ 'now' | date: '%Y' }} Sree Vishnu</span><span>A work in progress, always.</span><a href="https://github.com/sreevishnu0506-cyber">GitHub ↗</a></footer></body></html>
